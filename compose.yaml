services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: emdash
      POSTGRES_USER: emdash
      POSTGRES_PASSWORD: emdash
    ports:
      - "55432:5432"
    volumes:
      - emdash-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emdash -d emdash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emdash-postgres:
